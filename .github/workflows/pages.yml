name: Deploy site (skipped)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions required for a future GitHub Actions-based Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    # Site build is skipped for now — the docs/ directory does not exist yet.
    # To enable: create docs/, set Pages source to "GitHub Actions", and remove this condition.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
