name: "Copilot Setup Steps"

# Run automatically when this file changes, and allow manual triggers for validation.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job name MUST be `copilot-setup-steps` — Copilot coding agent looks for it by name.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch orphan branch refs for Copilot diff baseline
        run: |
          git fetch origin agent-reports:agent-reports || true
          git fetch origin reports:reports || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies into .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
