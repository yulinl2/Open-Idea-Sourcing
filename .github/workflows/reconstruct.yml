name: Staged Reconstruction — CI

# CI guardrail: fast unit tests only.
# Full reconstruction runs are dispatched from the Claude Code sandbox
# (not GitHub Actions) to avoid burning Actions minutes on LLM calls
# and rate-limit backoff waits.

on:
  push:
    branches:
      - agent-staged-reconstruct
      - claude/agent-staged-reconstruct-*
      - claude/archive-results-fetch-papers-*
      - claude/advanced-algorithm-testing-*

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow"
