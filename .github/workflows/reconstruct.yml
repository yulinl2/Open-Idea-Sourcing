name: Staged Reconstruction

on:
  push:
    branches:
      - agent-staged-reconstruct
      - claude/agent-staged-reconstruct-*
  workflow_dispatch:
    inputs:
      paper_url:
        description: "Paper URL (blank = all test papers)"
        required: false
        default: ""
      modes:
        description: "Reconstruction modes (comma-separated, blank = all)"
        required: false
        default: ""
      student_model:
        description: "Student model"
        required: false
        default: "gpt-4o"
      teacher_model:
        description: "Teacher model"
        required: false
        default: "gpt-5.4"
      evaluate:
        description: "Run teacher evaluation scoring"
        type: boolean
        required: false
        default: true
      conditions:
        description: "Conditions (comma-separated: with_refs,no_refs)"
        required: false
        default: "with_refs,no_refs"

concurrency:
  group: "staged-reconstruct"
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Job 1: Unit tests (no API key)
  # ------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v -m "not slow"

  # ------------------------------------------------------------------
  # Job 2: Run reconstruction (manual dispatch only)
  # ------------------------------------------------------------------
  reconstruct:
    name: Run reconstruction
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.paper_url }}" ]; then
            ARGS="$ARGS --paper-url '${{ inputs.paper_url }}'"
          fi
          if [ -n "${{ inputs.modes }}" ]; then
            # Convert comma-separated to space-separated
            MODES=$(echo "${{ inputs.modes }}" | tr ',' ' ')
            ARGS="$ARGS --modes $MODES"
          fi
          ARGS="$ARGS --student-model ${{ inputs.student_model }}"
          ARGS="$ARGS --teacher-model ${{ inputs.teacher_model }}"
          if [ "${{ inputs.evaluate }}" = "true" ]; then
            ARGS="$ARGS --evaluate"
          fi
          if [ -n "${{ inputs.conditions }}" ]; then
            CONDITIONS=$(echo "${{ inputs.conditions }}" | tr ',' ' ')
            ARGS="$ARGS --conditions $CONDITIONS"
          fi

          eval python agent.py $ARGS

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: "reconstruction-reports-${{ github.run_number }}"
          path: reports/

      - name: Commit reports to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add reports/
          if git diff --cached --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "reports: dispatch #${{ github.run_number }} (${{ inputs.student_model }}/${{ inputs.teacher_model }})"
            git push origin HEAD:agent-staged-reconstruct
          fi
