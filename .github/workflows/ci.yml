name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to review (e.g. https://arxiv.org/abs/2006.06138)"
        required: false
        default: ""
      paper_path:
        description: "Relative path to the paper file inside the repo (e.g. papers/my_paper.pdf) — used only when paper_url is empty"
        required: false
        default: ""
      references_path:
        description: "Relative path to a references JSON file (optional)"
        required: false
        default: ""
      output_format:
        description: "Report format: text | markdown | json"
        required: false
        default: "markdown"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  review:
    name: Review paper (manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.paper_url != '' || github.event.inputs.paper_path != '')
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review paper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_URL: ${{ inputs.paper_url }}
          PAPER_PATH: ${{ inputs.paper_path }}
          REFS_PATH: ${{ inputs.references_path }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          # URL takes precedence over path
          if [ -n "$PAPER_URL" ]; then
            PAPER_ARG="$PAPER_URL"
          else
            PAPER_ARG="$PAPER_PATH"
          fi

          if [ -n "$REFS_PATH" ]; then
            python review_paper.py "$PAPER_ARG" \
              --references "$REFS_PATH" \
              --format "$OUTPUT_FORMAT"
          else
            python review_paper.py "$PAPER_ARG" \
              --format "$OUTPUT_FORMAT"
          fi
