name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to review (e.g. https://arxiv.org/abs/2006.06138)"
        required: false
        default: ""
      papers_file:
        description: "NDJSON batch file name inside data/ listing papers to review (default: test_papers.ndjson) — used only when paper_url is empty"
        required: false
        default: "test_papers.ndjson"
      references:
        description: "JSON reference store filename inside data/ to compare against (default: references.json — bundled baseline corpus)"
        required: false
        default: "references.json"
      output_format:
        description: "Report format: text | markdown | json | pdf (default: markdown)"
        required: false
        default: "markdown"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  review:
    name: Review paper (manual trigger, main merge, or same-repo PR)
    runs-on: ubuntu-latest
    # Run on:
    #   - manual workflow_dispatch triggers
    #   - pushes to main (post-merge validation)
    #   - pull_request events from the same repository (dev feedback loop;
    #     forks are excluded because secrets are not available there)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: test
    permissions:
      contents: write

    steps:
      - name: Validate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PAPER_URL: ${{ inputs.paper_url }}
          PAPERS_FILE: ${{ inputs.papers_file }}
          GH_PAPER_URL: ${{ github.event.inputs.paper_url }}
          GH_PAPERS_FILE: ${{ github.event.inputs.papers_file }}
        run: |
          # Push-triggered runs always use the default batch file — no inputs to validate.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Push-triggered run — using default batch file (data/test_papers.ndjson)."
            exit 0
          fi
          # PR-triggered runs also use the default batch file.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "PR-triggered run — using default batch file (data/test_papers.ndjson)."
            exit 0
          fi
          PAPER_URL="${PAPER_URL:-$GH_PAPER_URL}"
          PAPERS_FILE="${PAPERS_FILE:-$GH_PAPERS_FILE}"
          if [ -z "$PAPER_URL" ] && [ -z "$PAPERS_FILE" ]; then
            echo "::error::Please provide paper_url or papers_file when triggering this workflow. Both are currently empty."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review paper(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_URL: ${{ inputs.paper_url }}
          PAPERS_FILE: ${{ inputs.papers_file }}
          REFERENCES: ${{ inputs.references }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          GH_PAPER_URL: ${{ github.event.inputs.paper_url }}
          GH_PAPERS_FILE: ${{ github.event.inputs.papers_file }}
          GH_REFERENCES: ${{ github.event.inputs.references }}
          GH_OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fall back to github.event.inputs for re-run compatibility
          PAPER_URL="${PAPER_URL:-$GH_PAPER_URL}"
          PAPERS_FILE="${PAPERS_FILE:-$GH_PAPERS_FILE}"
          REFERENCES="${REFERENCES:-$GH_REFERENCES}"
          OUTPUT_FORMAT="${OUTPUT_FORMAT:-$GH_OUTPUT_FORMAT}"

          mkdir -p reports

          # Build optional --references flag; omit when empty so review_paper.py
          # falls back to its own default (data/references.json).
          REFS_FLAG=""
          if [ -n "$REFERENCES" ]; then
            REFS_FLAG="--references data/$REFERENCES"
          fi

          # URL takes precedence over batch file; batch file is relative to data/
          if [ -n "$PAPER_URL" ]; then
            # shellcheck disable=SC2086
            python review_paper.py "$PAPER_URL" \
              $REFS_FLAG \
              --format "${OUTPUT_FORMAT:-markdown}" \
              --reports-dir reports
          else
            # shellcheck disable=SC2086
            python review_paper.py \
              --papers-file "data/${PAPERS_FILE:-test_papers.ndjson}" \
              $REFS_FLAG \
              --format "${OUTPUT_FORMAT:-markdown}" \
              --reports-dir reports
          fi

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: src-ideas-reports
          path: reports/

      - name: Publish reports to reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Set up a worktree pointing at the reports branch (create orphan if absent)
          if git ls-remote --exit-code --heads origin reports > /dev/null 2>&1; then
            git fetch origin reports
            git worktree add /tmp/reports-branch origin/reports
          else
            git worktree add --orphan -b reports /tmp/reports-branch
          fi

          cp reports/* "/tmp/reports-branch/"

          cd /tmp/reports-branch
          git add .
          if git diff --cached --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "reports: run #${{ github.run_number }}"
            git push origin HEAD:reports
          fi

  report-review:
    name: AI report quality review
    runs-on: ubuntu-latest
    # Runs after review completes, mirroring the same trigger conditions.
    # The review agent reads generated reports, assesses their quality with an
    # LLM, and writes structured feedback to the step summary and (on PRs) as
    # a pull request comment — giving developers an immediate signal on
    # concept tree depth, novelty grounding, and pipeline health.
    needs: review
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download generated reports
        uses: actions/download-artifact@v4
        with:
          name: src-ideas-reports
          path: reports/

      - name: List downloaded reports
        run: ls -lh reports/

      - name: Run report review agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          shopt -s nullglob
          REPORT_FILES=(reports/*.md reports/*.markdown)
          if [ ${#REPORT_FILES[@]} -eq 0 ]; then
            echo "No Markdown reports found to review."
            exit 0
          fi
          # Always write to step summary.
          # Also post as a PR comment only when the event is pull_request AND
          # PR_NUMBER is populated (prevents accidental comment posting on push/dispatch).
          POST_FLAG=""
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            POST_FLAG="--post-pr-comment"
          fi
          # shellcheck disable=SC2086
          python scripts/report_review_agent.py \
            "${REPORT_FILES[@]}" \
            --output-md reports/feedback.md \
            --github-summary \
            $POST_FLAG

      - name: Upload feedback as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: src-ideas-report-feedback
          path: reports/feedback.md
          if-no-files-found: ignore

