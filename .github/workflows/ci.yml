name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate workflow guardrails
        run: python -m pytest tests/test_workflow_guardrails.py -v

      - name: Run fast tests
        run: python -m pytest tests/ -v -m "not slow"

      - name: Run full test suite
        # Full suite (including @pytest.mark.slow integration tests) only runs
        # on manual workflow_dispatch to avoid 4+ hour bills on every merge to main.
        if: github.event_name == 'workflow_dispatch'
        run: python -m pytest tests/ -v
