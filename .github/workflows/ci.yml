name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to review (e.g. https://arxiv.org/abs/2006.06138)"
        required: false
        default: ""
      paper_path:
        description: "Relative path to the paper file inside the repo (e.g. papers/my_paper.pdf) — used only when paper_url is empty"
        required: false
        default: ""
      references_path:
        description: "Relative path to a references JSON file (optional)"
        required: false
        default: ""
      output_format:
        description: "Report format: text | markdown | json | pdf (default: pdf)"
        required: false
        default: "pdf"
      papers_file:
        description: "Relative path to an NDJSON batch file listing papers to review (default: data/test_papers.ndjson) — used only when paper_url and paper_path are both empty"
        required: false
        default: "data/test_papers.ndjson"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  review:
    name: Review paper (manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write

    steps:
      - name: Validate inputs
        env:
          PAPER_URL: ${{ inputs.paper_url }}
          PAPER_PATH: ${{ inputs.paper_path }}
          PAPERS_FILE: ${{ inputs.papers_file }}
          GH_PAPER_URL: ${{ github.event.inputs.paper_url }}
          GH_PAPER_PATH: ${{ github.event.inputs.paper_path }}
          GH_PAPERS_FILE: ${{ github.event.inputs.papers_file }}
        run: |
          PAPER_URL="${PAPER_URL:-$GH_PAPER_URL}"
          PAPER_PATH="${PAPER_PATH:-$GH_PAPER_PATH}"
          PAPERS_FILE="${PAPERS_FILE:-$GH_PAPERS_FILE}"
          if [ -z "$PAPER_URL" ] && [ -z "$PAPER_PATH" ] && [ -z "$PAPERS_FILE" ]; then
            echo "::error::Please provide paper_url, paper_path, or papers_file when triggering this workflow. All three are currently empty."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review paper(s)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_URL: ${{ inputs.paper_url }}
          PAPER_PATH: ${{ inputs.paper_path }}
          PAPERS_FILE: ${{ inputs.papers_file }}
          REFS_PATH: ${{ inputs.references_path }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
          GH_PAPER_URL: ${{ github.event.inputs.paper_url }}
          GH_PAPER_PATH: ${{ github.event.inputs.paper_path }}
          GH_PAPERS_FILE: ${{ github.event.inputs.papers_file }}
          GH_REFS_PATH: ${{ github.event.inputs.references_path }}
          GH_OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Fall back to github.event.inputs for re-run compatibility
          PAPER_URL="${PAPER_URL:-$GH_PAPER_URL}"
          PAPER_PATH="${PAPER_PATH:-$GH_PAPER_PATH}"
          PAPERS_FILE="${PAPERS_FILE:-$GH_PAPERS_FILE}"
          REFS_PATH="${REFS_PATH:-$GH_REFS_PATH}"
          OUTPUT_FORMAT="${OUTPUT_FORMAT:-$GH_OUTPUT_FORMAT}"

          mkdir -p reports

          # Build the optional --references flag
          REFS_FLAG=""
          if [ -n "$REFS_PATH" ]; then
            REFS_FLAG="--references $REFS_PATH"
          fi

          # URL/path takes precedence over batch file
          if [ -n "$PAPER_URL" ]; then
            python review_paper.py "$PAPER_URL" \
              --format "${OUTPUT_FORMAT:-pdf}" \
              --reports-dir reports \
              $REFS_FLAG
          elif [ -n "$PAPER_PATH" ]; then
            python review_paper.py "$PAPER_PATH" \
              --format "${OUTPUT_FORMAT:-pdf}" \
              --reports-dir reports \
              $REFS_FLAG
          else
            # Batch mode — use the papers file (default: data/test_papers.ndjson)
            python review_paper.py \
              --papers-file "${PAPERS_FILE:-data/test_papers.ndjson}" \
              --format "${OUTPUT_FORMAT:-pdf}" \
              --reports-dir reports \
              $REFS_FLAG
          fi

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: src-ideas-reports
          path: reports/

      - name: Publish reports to reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Set up a worktree pointing at the reports branch (create orphan if absent)
          if git ls-remote --exit-code --heads origin reports > /dev/null 2>&1; then
            git fetch origin reports
            git worktree add /tmp/reports-branch origin/reports
          else
            git worktree add --orphan -b reports /tmp/reports-branch
          fi

          cp reports/* "/tmp/reports-branch/"

          cd /tmp/reports-branch
          git add .
          if git diff --cached --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "reports: run #${{ github.run_number }}"
            git push origin HEAD:reports
          fi
