name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to review (e.g. https://arxiv.org/abs/2006.06138)"
        required: false
        default: ""
      paper_path:
        description: "Relative path to the paper file inside the repo (e.g. papers/my_paper.pdf) — used only when paper_url is empty"
        required: false
        default: ""
      references_path:
        description: "Relative path to a references JSON file (optional)"
        required: false
        default: ""
      output_format:
        description: "Report format: text | markdown | json | pdf (default: pdf)"
        required: false
        default: "markdown"

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  review:
    name: Review paper (manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.paper_url }}" ] && [ -z "${{ inputs.paper_path }}" ]; then
            echo "::error::Please provide either 'paper_url' or 'paper_path' when triggering this workflow. Both are currently empty."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Review paper
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_URL: ${{ inputs.paper_url }}
          PAPER_PATH: ${{ inputs.paper_path }}
          REFS_PATH: ${{ inputs.references_path }}
          OUTPUT_FORMAT: ${{ inputs.output_format }}
        run: |
          # URL takes precedence over path
          if [ -n "$PAPER_URL" ]; then
            PAPER_ARG="$PAPER_URL"
          else
            PAPER_ARG="$PAPER_PATH"
          fi

          # Auto-save to reports/ with an informative filename
          if [ -n "$REFS_PATH" ]; then
            python review_paper.py "$PAPER_ARG" \
              --references "$REFS_PATH" \
              --format "$OUTPUT_FORMAT" \
              --reports-dir reports
          else
            python review_paper.py "$PAPER_ARG" \
              --format "$OUTPUT_FORMAT" \
              --reports-dir reports
          fi

          # Capture the filename that was just written
          REPORT_FILE=$(ls reports/)
          echo "REPORT_FILE=reports/$REPORT_FILE" >> "$GITHUB_ENV"

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: src-ideas-report
          path: ${{ env.REPORT_FILE }}

      - name: Publish report to reports branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          REPORT_FILE="${{ env.REPORT_FILE }}"
          REPORT_NAME=$(basename "$REPORT_FILE")

          # Set up a worktree pointing at the reports branch (create orphan if absent)
          if git ls-remote --exit-code --heads origin reports > /dev/null 2>&1; then
            git fetch origin reports
            git worktree add /tmp/reports-branch origin/reports
          else
            git worktree add --orphan -b reports /tmp/reports-branch
          fi

          cp "$REPORT_FILE" "/tmp/reports-branch/$REPORT_NAME"

          cd /tmp/reports-branch
          git add "$REPORT_NAME"
          git commit -m "report: $REPORT_NAME (run #${{ github.run_number }})"
          git push origin HEAD:reports
