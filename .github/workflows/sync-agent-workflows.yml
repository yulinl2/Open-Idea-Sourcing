name: Sync Agent Workflows to Main

# Keeps workflow files that live on agent branches (infra-base, agent-*)
# visible in the GitHub Actions UI by copying them to main.
#
# GitHub only surfaces workflow_dispatch triggers for workflows that exist
# on the default branch.  Any workflow added to infra-base (or another
# agent branch) must therefore also be present on main to be triggerable.
#
# This workflow handles that automatically:
#   • Auto-trigger — fires whenever .github/workflows/ changes on infra-base
#                    (via repository_dispatch or push to that branch if you
#                     add a push trigger there)
#   • Manual trigger — run at any time to re-sync

on:
  # Fires when infra-base (or another agent branch) is pushed
  push:
    branches:
      - infra-base
    paths:
      - ".github/workflows/**"

  # Manual re-sync from the Actions UI
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to sync workflows from (default: infra-base)"
        required: false
        default: "infra-base"
      dry_run:
        description: "Dry run (true = show what would change, no commit)"
        required: false
        default: "false"

jobs:
  sync:
    name: Sync workflows → main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine source branch
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "branch=${{ inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          else
            # push event — use the branch that triggered this workflow
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch source branch
        run: |
          git fetch origin "${{ steps.source.outputs.branch }}"

      - name: Copy new workflows to main
        id: copy
        run: |
          SOURCE="origin/${{ steps.source.outputs.branch }}"
          DEST=".github/workflows"
          COPIED=0

          # List all workflow files on the source branch
          while IFS= read -r file; do
            filename=$(basename "$file")

            # Skip files that are sync-related (this workflow itself)
            if [ "$filename" = "sync-agent-workflows.yml" ]; then
              continue
            fi

            # Check if the file already exists on main with identical content
            if [ -f "$DEST/$filename" ]; then
              src_hash=$(git show "$SOURCE:.github/workflows/$filename" | sha256sum | cut -d' ' -f1)
              dst_hash=$(sha256sum "$DEST/$filename" | cut -d' ' -f1)
              if [ "$src_hash" = "$dst_hash" ]; then
                echo "  [skip]   $filename (already up-to-date)"
                continue
              fi
            fi

            echo "  [copy]   $filename"
            git show "$SOURCE:.github/workflows/$filename" > "$DEST/$filename"
            COPIED=$((COPIED + 1))
          done < <(git ls-tree --name-only "$SOURCE" .github/workflows/)

          echo "copied=$COPIED" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.copy.outputs.copied != '0' && inputs.dry_run != 'true'
        run: |
          git add .github/workflows/
          git commit -m "chore: sync workflow files from ${{ steps.source.outputs.branch }} to main [skip ci]"
          git push origin main

      - name: Summary
        run: |
          printf '### Workflow sync complete\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source branch: `%s`\n\n' "${{ steps.source.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.copy.outputs.copied }}" = "0" ]; then
            printf 'All workflows already up-to-date — nothing to sync.\n' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            printf '%s workflow(s) would be synced (dry run — no changes committed).\n' \
              "${{ steps.copy.outputs.copied }}" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s workflow(s) synced and pushed to main.\n' \
              "${{ steps.copy.outputs.copied }}" >> "$GITHUB_STEP_SUMMARY"
          fi
