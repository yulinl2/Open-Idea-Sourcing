name: Debate CI

# Dispatch + CI for the ip_debate (IP debate / reconstruction) pipeline.
# This is a separate workflow from ci.yml — it drives the 0.x version series
# and will eventually trigger debate pipeline runs instead of the baseline
# novelty-evaluation pipeline.

on:
  push:
    branches:
      - "copilot/ip-debate-reconstruction-demo"
      - "debate/**"
  pull_request:
    branches:
      - "copilot/ip-debate-reconstruction-demo"
      - "debate/**"
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to run through the debate pipeline (e.g. https://arxiv.org/abs/2006.06138)"
        required: false
        default: ""
      papers_file:
        description: "NDJSON batch file name inside data/ listing papers (default: test_papers.ndjson) — used only when paper_url is empty"
        required: false
        default: "test_papers.ndjson"
      debate_mode:
        description: "Debate strategy: crewai | wasserstein | hybrid (default: crewai — not yet implemented)"
        required: false
        default: "crewai"
      output_format:
        description: "Report format: text | markdown | json (default: markdown)"
        required: false
        default: "markdown"

jobs:
  test:
    name: Run tests (ip_debate scaffold)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ip_debate smoke tests
        run: python -m pytest tests/test_ip_debate.py -v

      - name: Verify ip_debate version
        run: python -c "import ip_debate; print('ip_debate', ip_debate.__version__)"

  debate:
    name: Run debate pipeline (manual trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run debate pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Build the CLI args for ip_debate.run — the debate-track entrypoint.
          # This is intentionally separate from review_paper.py (baseline CLI).
          ARGS=""
          if [ -n "${{ inputs.paper_url }}" ]; then
            ARGS="--paper-url ${{ inputs.paper_url }}"
          else
            ARGS="--papers-file data/${{ inputs.papers_file || 'test_papers.ndjson' }}"
          fi
          ARGS="$ARGS --debate-mode ${{ inputs.debate_mode || 'crewai' }}"
          ARGS="$ARGS --output-format ${{ inputs.output_format || 'markdown' }}"

          echo "ip_debate v$(python -c 'import ip_debate; print(ip_debate.__version__)')"
          echo "Calling: python -m ip_debate.run $ARGS"
          # In v0.0.0 the pipeline raises NotImplementedError (exit 1).
          # Treat that specific exit code as "stub — not yet built" and exit 0
          # so the dispatch job doesn't block CI before the pipeline exists.
          # Remove the `|| true` guard once the pipeline is implemented.
          python -m ip_debate.run $ARGS 2>&1 | tee /tmp/debate_run.log; EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -eq 0 ]; then
            echo "Pipeline completed."
          elif grep -q "NotImplementedError" /tmp/debate_run.log; then
            echo "Pipeline stub — not yet implemented (v0.0.0). Skipping."
          else
            echo "Pipeline failed (exit $EXIT)." && exit "$EXIT"
          fi
