name: Pipeline Smoke Tests

on:
  push:
    branches:
      - claude/add-report-timestamp-*
  workflow_dispatch:

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/smoke_test.py || true

      - name: Run scale tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/scale_test.py || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tests/results/
          if-no-files-found: warn

      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status tests/results/ --porcelain)" ]; then
            git add tests/results/
            git commit -m "smoke-tests: publish results [skip ci]"
            git push
          else
            echo "No test results to commit"
          fi
