name: Pipeline Smoke Tests

on:
  push:
    branches:
      - claude/add-report-timestamp-*
  workflow_dispatch:

jobs:
  smoke:
    name: Run smoke tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/smoke_test.py || true

      - name: Run scale tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python tests/scale_test.py || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: tests/results/
          if-no-files-found: warn

      - name: Commit test results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status tests/results/ --porcelain)" ]; then
            git add tests/results/
            git commit -m "smoke-tests: publish results [skip ci]"
            git push
          else
            echo "No test results to commit"
          fi

      - name: Trigger full analysis run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dispatch the full Geo-Perplexity Analysis workflow on this branch
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/geo-perplexity.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"models":"gpt-4o"}}' \
            && echo "Dispatched full analysis on ${{ github.ref_name }}" \
            || echo "Dispatch failed (workflow may not exist on this ref yet)"
