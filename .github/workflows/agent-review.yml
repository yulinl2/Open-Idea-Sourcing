name: Agent review

# Parallel agent-track CI — runs independently of the baseline ci.yml pipeline.
#
# Trigger: Manual (workflow_dispatch) only on main — this keeps the "Run workflow"
# button visible in the Actions UI and lets agent-track-workflows.yml dispatch it
# via `gh workflow run agent-review.yml --ref main`.
#
# Push-triggered infra tests (push to agent-* branches) live in the copy of this
# file on infra-base and each agent-* branch, not on main.  Keeping push triggers
# off the main-branch copy prevents phantom failure check-runs on every copilot/*
# PR branch push.
#
# This workflow is branch-local by design: each agent-* branch carries its own
# agent.py and this workflow discovers it automatically via the TRACK variable.
# The baseline ci.yml (review_paper.py) is unaffected.

on:
  workflow_dispatch:
    inputs:
      paper_url:
        description: "URL of the paper to review (arXiv abstract or PDF)"
        required: true
        default: "https://arxiv.org/abs/2006.06138"
      track:
        description: "Agent track to use (choose all to fan out)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - e2e
          - linear
          - reconstruct
      model:
        description: "LLM model identifier (e.g. gpt-4o, gpt-4o-mini)"
        required: false
        default: "gpt-4o"

# Prevent concurrent agent runs on the same track from interfering.
concurrency:
  group: "agent-${{ inputs.track || github.ref_name }}"
  cancel-in-progress: false

jobs:
  resolve-track-matrix:
    name: Resolve track matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve matrix from input
        id: resolve
        env:
          TRACK_INPUT: ${{ inputs.track }}
        run: |
          if [ "$TRACK_INPUT" = "all" ]; then
            echo 'matrix={"track":["e2e","linear","reconstruct"]}' >> "$GITHUB_OUTPUT"
          else
            printf 'matrix={"track":["%s"]}\n' "$TRACK_INPUT" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Job 1: Run infra unit tests (no API key needed)
  # ------------------------------------------------------------------
  test-infra:
    name: Infra tests
    runs-on: ubuntu-latest
    needs: resolve-track-matrix

    steps:
      - uses: actions/checkout@v4
        with:
          # infra/ and tests/ live on infra-base (the orphan branch that owns the
          # shared execution shell). Checking out infra-base here means infra/ does
          # not need to be duplicated on main.
          ref: infra-base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install base requirements if present; fall back to pdfminer only
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pdfminer.six
          fi

      - name: Run infra unit tests
        run: |
          # Run infra-specific tests if the test directory exists.
          # Falls back to a basic import smoke-test until track tests are added.
          if [ -d tests ] && python -m pytest tests/ --co -q 2>/dev/null | grep -q "agent"; then
            python -m pytest tests/ -v -k "agent or infra" -m "not slow"
          else
            python -c "from infra import RunContext, ReportContent, ReportWriter, ToolRegistry; ctx = RunContext(track='smoke', impl_id='smoke_v0', paper_id='test', paper_source='local', model='stub'); ctx.record_tool('smoke_tool'); ctx.mark_finished(); fm = ctx.to_yaml_front_matter(); assert 'track:' in fm, 'YAML front matter missing track'; assert 'smoke_tool' in fm, 'YAML front matter missing tool'; print('Infra smoke test passed.')"
          fi

  # ------------------------------------------------------------------
  # Job 2: Run agent review (manual trigger only — requires OPENAI_API_KEY)
  # ------------------------------------------------------------------
  agent-review:
    name: "Agent review (${{ matrix.track }})"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: [resolve-track-matrix, test-infra]
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.resolve-track-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        id: checkout-track
        with:
          # Check out the agent-<track> branch so agent.py is present.
          # Falls back to the current ref if the track branch doesn't exist yet.
          ref: "agent-${{ matrix.track }}"
        continue-on-error: true

      - name: Fallback checkout (track branch not yet created)
        uses: actions/checkout@v4
        if: ${{ steps.checkout-track.outcome == 'failure' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            python -m pip install pdfminer.six openai
          fi

      - name: Derive paper ID from URL
        id: paper
        env:
          PAPER_URL: ${{ inputs.paper_url }}
        run: |
          # Extract a filesystem-safe paper ID from the URL.
          # arXiv: https://arxiv.org/abs/2006.06138 → 2006.06138
          PAPER_ID=$(python -c "import re, os; url = os.environ['PAPER_URL']; m = re.search(r'arxiv\.org/(?:abs|pdf)/([0-9]+\.[0-9]+)', url); print(m.group(1) if m else url.rstrip('/').split('/')[-1].replace('.pdf', '')[:50])")
          echo "PAPER_ID=$PAPER_ID" >> "$GITHUB_OUTPUT"
          echo "Derived paper ID: $PAPER_ID"

      - name: Validate OPENAI_API_KEY
        id: keycheck
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. Configure repository secret OPENAI_API_KEY and retry."
            exit 1
          fi
          if printf '%s' "$OPENAI_API_KEY" | grep -Eq '^\*+$|^sk-\*+$|^\$\{\{.*\}\}$'; then
            echo "::error::OPENAI_API_KEY appears to be a placeholder/masked literal (for example ***). Use a real API key value."
            exit 1
          fi
          # Detect any whitespace or ASCII control characters.
          # These make the HTTP Authorization header value illegal and cause
          # httpx to raise LocalProtocolError ("Illegal header value").
          if ! python -c "import os, sys; key = os.environ['OPENAI_API_KEY']; sys.exit(1 if any(ch.isspace() or ord(ch) < 32 or ord(ch) == 127 for ch in key) else 0)"; then
            echo "::error::OPENAI_API_KEY contains whitespace or control characters (e.g. a trailing newline). Re-save the secret with only the raw key value, no line breaks, spaces, or other control characters."
            exit 1
          fi
          echo "OPENAI_API_KEY format check passed."

      - name: Validate track implementation exists
        run: |
          if [ ! -f agent.py ]; then
            echo "::error::agent.py is missing on branch agent-${{ matrix.track }}."
            echo "::error::No placeholder reports are emitted in strict mode. Add agent.py to that track branch first."
            exit 1
          fi

      - name: Run agent review
        id: run-agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPER_URL: ${{ inputs.paper_url }}
          TRACK: ${{ matrix.track }}
          MODEL: ${{ inputs.model }}
          PAPER_ID: ${{ steps.paper.outputs.PAPER_ID }}
        run: |
          mkdir -p reports
          python agent.py \
            --paper-url "$PAPER_URL" \
            --model "${MODEL:-gpt-4o}" \
            --output reports/report.md

          if [ ! -s reports/report.md ]; then
            echo "::error::agent.py completed but reports/report.md is missing or empty."
            exit 1
          fi

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "agent-${{ matrix.track }}-report-${{ steps.paper.outputs.PAPER_ID }}"
          path: reports/report.md

      - name: Publish report to agent-reports branch
        env:
          TRACK: ${{ matrix.track }}
          PAPER_ID: ${{ steps.paper.outputs.PAPER_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          # Publish under agent-<track>/<paper_id>/report.md inside the
          # agent-reports orphan branch (namespaced away from baseline reports/).
          TARGET_DIR="agent-${TRACK}/${PAPER_ID}"

          if git ls-remote --exit-code --heads origin agent-reports > /dev/null 2>&1; then
            git fetch origin agent-reports
            git worktree add /tmp/agent-reports-branch origin/agent-reports
          else
            git worktree add --detach /tmp/agent-reports-branch HEAD
            git -C /tmp/agent-reports-branch checkout --orphan agent-reports
            git -C /tmp/agent-reports-branch rm -rf --quiet -- . 2>/dev/null || true
          fi

          mkdir -p "/tmp/agent-reports-branch/${TARGET_DIR}"
          cp reports/report.md "/tmp/agent-reports-branch/${TARGET_DIR}/report.md"

          cd /tmp/agent-reports-branch
          git add .
          if git diff --cached --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "agent report: ${TRACK}/${PAPER_ID} (run #${RUN_NUMBER})"
            git push origin HEAD:agent-reports
          fi
