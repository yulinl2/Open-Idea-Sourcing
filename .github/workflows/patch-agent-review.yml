name: Patch agent-review.yml on orphan branches

# One-shot workflow: writes the correct agent-review.yml to infra-base (and
# optionally each agent-track branch).
#
# The canonical agent-review.yml for infra-base / agent-* branches is identical
# to main's version except it also carries a push trigger for infra-base and
# each agent-* branch.  The push trigger must NOT live on main's copy (it causes
# phantom failure check-runs on every copilot/* PR branch push).
#
# Run this after merging the main cleanup PR to ensure infra-base has:
#   • The shell-based placeholder fix (from PR #78)
#   • The infra-base push trigger
#   • The clean `git worktree add --orphan` orphan branch handling
#
# Trigger:
#   Actions → Patch agent-review.yml on orphan branches → Run workflow

on:
  workflow_dispatch:
    inputs:
      branches:
        description: "Space-separated branches to update (default: all)"
        required: false
        default: "infra-base agent-e2e agent-linear agent-reconstruct"
      dry_run:
        description: "Dry run (true = show what would change, no push)"
        required: false
        default: "false"

jobs:
  patch:
    name: Patch agent-review.yml
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.12"

      - name: Fetch target branches
        run: |
          for branch in ${{ inputs.branches }}; do
            git fetch origin "$branch" || true
          done

      - name: Run patch script (dry run)
        if: inputs.dry_run == 'true'
        run: |
          echo "DRY RUN — would update: ${{ inputs.branches }}"
          python3 -c "
          import scripts.fix_orphan_agent_review as m
          print('Target content preview (first 30 lines):')
          for i, line in enumerate(m.INFRA_AGENT_REVIEW_YML.splitlines()[:30]):
              print(f'  {line}')
          "

      - name: Run patch script
        if: inputs.dry_run != 'true'
        run: |
          python3 scripts/fix_orphan_agent_review.py \
            --branches ${{ inputs.branches }}

      - name: Summary
        run: |
          printf '### Patch complete\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Branches targeted: `%s`\n\n' "${{ inputs.branches }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            printf 'Dry run — no changes pushed.\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'agent-review.yml updated on each branch that was outdated.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
