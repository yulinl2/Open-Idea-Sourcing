# Open-Idea-Sourcing pipeline configuration
# All settings here are applied as defaults; CLI flags always take precedence.

# LLM model to use for general analysis (default: gpt-5.4)
# model: gpt-5.4

# Model for Stage 2 decomposition — high-reasoning tasks benefit from o3/o4.
# Omit to reuse the main model above.
# decomposition_model: o3

# Stage 2 decomposition mode.
# "llm"        — use the LLM to generate the concept tree (default).
# "hardcoded"  — skip LLM decomposition and inject a fixed concept tree from
#                a file.  Set hardcoded_decomposition_file to a JSON path.
# Useful for ablation: hold the decomposition constant across runs to isolate
# the effect of retrieval or evaluation changes.
# decomposition_mode: llm
# hardcoded_decomposition_file: decomposition_override.json

# Minimum cosine-similarity threshold for reference papers
# similarity_threshold: 0.1

# Skip online reference search
# no_online_search: false

# Skip user reference corpus (data/references.json)
# no_user_refs: false

# Only include papers published from this year onwards
# since_year: null
