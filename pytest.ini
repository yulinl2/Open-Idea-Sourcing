[pytest]
# Custom markers
# Use @pytest.mark.slow on test classes / functions that exercise large
# subsystems end-to-end (full pipeline, full evaluation chain, etc.).
# The default CI run uses `-m "not slow"` to keep PR feedback fast.
# Run the full suite locally with `pytest` or via the scheduled CI job.
markers =
    slow: marks tests as slow / integration-style (deselect with -m "not slow")
